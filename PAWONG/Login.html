<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAWONG | 로그인</title>
    <link rel="stylesheet" href="./Home.css" />
    <link rel="stylesheet" href="./Login.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./Home.html" aria-label="PAWONG home">
        <span>PAWONG</span>
      </a>

      <nav class="nav-links" aria-label="main navigation">
        <a href="./Animals.html">아이들 만나기</a>
        <a href="./Support.html">후원 방법</a>
        <a href="./Adoption.html">입양 절차</a>
        <a href="./Consultation.html">상담 신청</a>
      </nav>

      <a class="header-button" href="./Login.html">로그인</a>
    </header>

    <main>
      <section class="login-section">
        <div class="login-copy">
          <p class="eyebrow">Welcome Back</p>
          <h1>PAWONG에 다시 오신 걸 환영해요</h1>
          <p>
            상담 신청 내역, 관심 있는 아이들, 후원 정보를 한곳에서 확인할 수
            있어요.
          </p>
        </div>

        <form class="login-form" action="#" method="post">
          <div class="form-heading">
            <p class="eyebrow">Login</p>
            <h2>로그인</h2>
          </div>

          <label>
            이메일
            <input
              type="email"
              name="email"
              placeholder="pawong@example.com"
              required
            />
          </label>

          <label>
            비밀번호
            <input
              type="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
              required
            />
          </label>

          <label class="login-check">
            <input type="checkbox" name="remember" />
            <span>로그인 상태 유지</span>
          </label>

          <button class="primary-button form-button" type="submit">
            로그인
          </button>

          <div class="login-links">
            <a href="./Password.html">비밀번호 찾기</a>
            <a href="./Signup.html">회원가입</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
