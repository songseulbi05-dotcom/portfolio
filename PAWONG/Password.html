<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAWONG | 비밀번호 찾기</title>
    <link rel="stylesheet" href="./Home.css" />
    <link rel="stylesheet" href="./Password.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./Home.html" aria-label="PAWONG home">
        <span>PAWONG</span>
      </a>

      <nav class="nav-links" aria-label="main navigation">
        <a href="./Animals.html">아이들 만나기</a>
        <a href="./Support.html">후원 방법</a>
        <a href="./Adoption.html">입양 절차</a>
        <a href="./Consultation.html">상담 신청</a>
      </nav>

      <a class="header-button" href="./Login.html">로그인</a>
    </header>

    <main>
      <section class="password-section">
        <div class="password-copy">
          <p class="eyebrow">Password Help</p>
          <h1>비밀번호를 다시 <br />설정할 수 있어요</h1>
          <p>
            가입한 이메일을 입력하면 비밀번호 재설정 안내를 받을 수 있습니다.
            <br />
            안전한 계정 확인을 위해 이메일 인증을 진행해요.
          </p>
        </div>

        <form class="password-form" action="#" method="post">
          <div class="form-heading">
            <p class="eyebrow">Reset Password</p>
            <h2>비밀번호 찾기</h2>
          </div>

          <label>
            가입 이메일
            <input
              type="email"
              name="email"
              placeholder="pawong@example.com"
              required
            />
          </label>

          <button class="primary-button form-button" type="submit">
            재설정 안내 받기
          </button>

          <p class="password-link">
            비밀번호가 기억났다면 <a href="./Login.html">로그인</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
